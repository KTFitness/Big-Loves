<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loves of My Life</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Big Loves">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDEFF1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#EDEFF1; --surface:#FFFFFF; --ink:#1B1F24; --muted:#5E6670; --line:#D6DAE0;
  --ok:#2E7D4F; --warn:#B4541A; --bad:#B3261E; --soft:#F5F6F8;
  --dog:#2F6B57; --dog-tint:rgba(47,107,87,.12);
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15181B;--surface:#1F2327;--ink:#ECEFF2;--muted:#9AA3AD;--line:#343A41;--soft:#262B30;
    --ok:#5BBE83;--warn:#E08A4F;--bad:#EF6C63;}
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--dog);outline-offset:2px}
h1,h2,h3{font-family:var(--round);margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:650}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* header: the dogs are the masthead */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px 8px;
  border-bottom:1px solid var(--line)}
.dogs{display:flex;gap:14px;align-items:flex-end}
.dogbtn{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.55;transition:opacity .15s}
.dogbtn.on{opacity:1}
.av{width:46px;height:46px;border-radius:50%;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;
  font:700 1.1rem var(--round);color:#fff;border:3px solid transparent}
.dogbtn.on .av{width:60px;height:60px;border-color:var(--c);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.dogbtn span{font:600 .8rem var(--round)}
.dogbtn.on span{color:var(--c)}
.headtitle{margin-left:auto;text-align:right}
.headtitle b{display:block;font:700 1.35rem var(--round);color:var(--dog);line-height:1.1}

main{padding:14px 14px 110px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border-radius:16px;padding:14px 14px;margin:0 0 12px;border:1px solid var(--line)}
.card.accent{border-left:5px solid var(--dog)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:8px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--dog);border-color:var(--dog);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.88rem;border-radius:10px}
.linkbtn{border:0;background:none;color:var(--dog);font-weight:600;padding:6px 0}

.datebar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.datebar .d{font:700 1.2rem var(--round)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:12px;font-size:1.2rem}

/* dose list */
.slot{padding-top:6px}
.slot+.slot{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
.slothead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.slothead .t{font:700 1.05rem var(--round);font-variant-numeric:tabular-nums}
.dose{display:flex;align-items:center;gap:10px;padding:6px 0;min-height:44px}
.tick{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1rem;color:#fff}
.tick.given{background:var(--ok);border-color:var(--ok)}
.tick.late{background:var(--warn);border-color:var(--warn)}
.tick.missed,.tick.vomited{background:var(--bad);border-color:var(--bad)}
.dose .lbl{flex:1;border:0;background:none;text-align:left;padding:0}
.dose .lbl b{font-weight:600}
.dose .lbl small{display:block;color:var(--muted);font-size:.84rem}
.chip{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.chip.given{background:rgba(46,125,79,.14);color:var(--ok)}
.chip.late{background:rgba(180,84,26,.14);color:var(--warn)}
.chip.missed,.chip.vomited,.chip.H,.chip.L{background:rgba(179,38,30,.13);color:var(--bad)}
.chip.dog{background:var(--dog-tint);color:var(--dog)}

/* counters */
.counter{display:flex;gap:14px;align-items:center}
.counter .big{font:800 2rem/1 var(--round);color:var(--dog);min-width:58px;text-align:center}
.counter .big small{display:block;font:600 .7rem var(--sans);color:var(--muted);margin-top:3px}
.counter+.counter{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}

/* quick taps */
.taps{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tap{border:1px solid var(--line);background:var(--soft);border-radius:12px;min-height:52px;padding:8px;font-weight:600;font-size:.92rem}
.tap:active{background:var(--dog-tint)}

.meal{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;min-height:48px;width:100%;border:0;background:none;text-align:left}
.meal+.meal{border-top:1px dashed var(--line)}
.meal b{font-weight:600}

.entry{display:flex;gap:10px;padding:9px 0;align-items:flex-start}
.entry+.entry{border-top:1px dashed var(--line)}
.entry .tm{font-variant-numeric:tabular-nums;color:var(--muted);min-width:46px;font-size:.9rem;padding-top:1px}
.entry .body{flex:1;min-width:0}
.entry button.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:2px 6px}

.banner{background:var(--dog-tint);border:1px solid var(--dog);border-radius:14px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* bloods */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mcard{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left}
.mcard .v{font:700 1.3rem var(--round);font-variant-numeric:tabular-nums}
.mcard svg{display:block;width:100%;height:34px;margin-top:4px}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{padding:12px 0;font:650 1rem var(--round);list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"−"}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border:0;border-top:1px dashed var(--line);background:none;width:100%;text-align:left}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
.tbl th{color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:.88rem;font-weight:600}
.seg button.on{background:var(--dog);color:#fff}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font:600 .72rem var(--round);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--dog)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  max-height:88vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease;max-width:720px;margin:0 auto}
.sheet:not(.open){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.sheet.open{transform:none}
.slotrow{display:grid!important;grid-template-columns:136px 1fr 40px;gap:6px}
.slotrow [data-f=label]{grid-column:1 / 3}
.slotrow{border-bottom:1px dashed var(--line);padding-bottom:8px}
.tick.idle{background:var(--soft)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
label.f{display:block;font-size:.85rem;color:var(--muted);font-weight:600;margin:12px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px;min-height:44px}
textarea.i{min-height:80px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 13px;font-weight:600;font-size:.9rem;min-height:40px}
.opt.on{background:var(--dog);border-color:var(--dog);color:#fff}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{padding:14px 2px;color:var(--muted)}
.pre{white-space:pre-line}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="view"></main>
<nav id="tabs"></nav>
<div class="scrim" id="scrim" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="photoIn" accept="image/*" hidden><input type="file" id="importIn" accept="application/json,.json" hidden>
<script>
'use strict';
const APP_VERSION = '3.8.7';
const KEY = 'bigloves-v1';

/* ---------- utilities ---------- */
const pad = n => String(n).padStart(2, '0');
const dk = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDk = k => { const p = k.split('-').map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); };
const addDays = (k, n) => { const d = parseDk(k); d.setDate(d.getDate() + n); return dk(d); };
const addMonths = (k, n) => {
  const d = parseDk(k); const day = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(day, last)); return dk(t);
};
const diffDays = (a, b) => Math.round((parseDk(b) - parseDk(a)) / 86400000);
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(k, withYear) {
  if (!k) return '';
  const p = k.split('-');
  if (p.length === 2) return MONTHS[+p[1] - 1] + ' ' + p[0];
  const d = parseDk(k);
  let s = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  if (withYear || d.getFullYear() !== new Date().getFullYear()) s += ' ' + d.getFullYear();
  return s;
}
function fmtShort(k) {
  const p = k.split('-');
  if (p.length === 2) return MONTHS[+p[1] - 1] + ' ' + p[0].slice(2);
  return +p[2] + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0].slice(2);
}
function ageText(dob) {
  if (!dob) return '';
  const p = dob.split('-').map(Number); const n = new Date();
  let m = (n.getFullYear() - p[0]) * 12 + (n.getMonth() + 1 - p[1]);
  const y = Math.floor(m / 12); m = m % 12;
  return y + ' yrs' + (m ? ' ' + m + ' mths' : '');
}
function hexTint(hex, a) {
  const h = hex.replace('#', ''); const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------- empty start: personal data arrives via the starter file ---------- */
function seed() {
  return { v: 1, dogs: [], meds: [], injections: [], doses: [], symptoms: [], meals: [], foods: [], markers: [], bloods: {}, lastBackup: null, created: dk() };
}
/* ---------- persistence ---------- */
let S;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { S = JSON.parse(raw); migrate(); save(); return; } } catch (e) { console.error(e); }
  S = seed(); migrate(); save();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save: phone storage may be full'); console.error(e); }
}
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }

/* ---------- ui state ---------- */
const UI = { dog: '', tab: 'today', date: dk(), today: dk(), logDays: 30, bloodRange: 'all' };
const dog = () => S.dogs.find(d => d.id === UI.dog) || S.dogs[0];
const tickTime = sl => ((S.settings || {}).tickTime === 'now' && UI.date === UI.today) ? nowHM() : ((sl && sl.t) || nowHM());
const hasDogs = () => S && S.dogs && S.dogs.length > 0;
const dogMeds = id => S.meds.filter(m => m.dogId === id);

/* ---------- schedule logic ---------- */
function isDueOn(m, date) {
  if (m.paused) return false;
  const s = m.schedule || { type: 'daily' };
  const d = parseDk(date);
  switch (s.type) {
    case 'daily': return true;
    case 'alternate': return s.anchor ? ((diffDays(s.anchor, date) % 2) + 2) % 2 === 0 : true;
    case 'monthly': return d.getDate() === +s.day;
    case 'quarterly': return d.getDate() === +s.day && (s.months || []).includes(d.getMonth() + 1);
    case 'weekly': return (s.days || []).includes(d.getDay());
    default: return false;
  }
}
function lastDueOnOrBefore(m, date) {
  for (let i = 0; i < 100; i++) { const k = addDays(date, -i); if (isDueOn(m, k)) return k; }
  return null;
}
function nextDueAfter(m, date) {
  for (let i = 1; i < 400; i++) { const k = addDays(date, i); if (isDueOn(m, k)) return k; }
  return null;
}
function doseEntry(medId, date, slot) {
  const list = S.doses.filter(x => x.medId === medId && x.date === date && x.slot === slot && ['given', 'late', 'missed', 'vomited'].includes(x.status));
  return list.length ? list[list.length - 1] : null;
}
function lastGivenOnOrAfter(medId, date) {
  return S.doses.filter(x => x.medId === medId && x.status !== 'missed' && x.date >= date && x.status !== 'vomited').sort((a, b) => a.date < b.date ? 1 : -1)[0] || null;
}
function schedText(m) {
  const s = m.schedule || {};
  const ord = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
  if (s.type === 'daily') return 'Daily';
  if (s.type === 'alternate') return 'Every second day from ' + fmtDate(s.anchor, true);
  if (s.type === 'monthly') return 'Monthly on the ' + ord(+s.day);
  if (s.type === 'weekly') return 'Weekly on ' + ((s.days || []).length ? [1, 2, 3, 4, 5, 6, 0].filter(x => s.days.includes(x)).map(x => DAYS[x]).join(' and ') : 'no days set');
  if (s.type === 'quarterly') return 'Quarterly on the ' + ord(+s.day) + ' of ' + (s.months || []).map(x => MONTHS[x - 1]).join(', ');
  if (s.type === 'prn') return 'As needed';
  return '';
}
function injDue(inj) {
  const last = inj.doses.length ? inj.doses.map(x => x.date).sort().slice(-1)[0] : null;
  if (!last) return { last: null };
  const due = inj.unit === 'months' ? addMonths(last, +inj.every) : addDays(last, +inj.every);
  return { last, due, since: diffDays(last, UI.today), until: diffDays(UI.today, due) };
}

/* ---------- toast + sheet ---------- */
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }
function openSheet(html) {
  const sh = document.getElementById('sheet');
  sh.innerHTML = '<div class="grab"></div>' + html; sh.scrollTop = 0;
  document.getElementById('scrim').classList.add('open'); sh.classList.add('open');
}
function closeSheet() { document.getElementById('scrim').classList.remove('open'); document.getElementById('sheet').classList.remove('open'); }
const $ = sel => document.querySelector('#sheet ' + sel);
const $$ = sel => Array.from(document.querySelectorAll('#sheet ' + sel));
function optVal(group) { const on = document.querySelector(`#sheet .opts[data-group="${group}"] .opt.on`); return on ? on.dataset.v : ''; }
function optsHtml(group, options, selected, multi) {
  return `<div class="opts" data-group="${group}" ${multi ? 'data-multi="1"' : ''}>` + options.map(o => {
    const v = typeof o === 'string' ? o : o.v; const l = typeof o === 'string' ? o : o.l;
    const on = multi ? (selected || []).includes(v) : selected === v;
    return `<button type="button" class="opt${on ? ' on' : ''}" data-act="opt" data-v="${esc(v)}">${esc(l)}</button>`;
  }).join('') + '</div>';
}

/* ---------- v1.1: appointments, day notes, meal detail, patterns ---------- */
function migrate() {
  if (!S) return;
  S.settings = S.settings || {}; S.appts = S.appts || []; S.focus = S.focus || [];
  if (!S.settings.wokeAdded) {
    (S.dogs || []).forEach(d => {
      const i = (d.symptoms || []).findIndex(s => s.id === 'panting');
      if (i >= 0 && !d.symptoms.some(s => /^woke up$/i.test(s.label))) d.symptoms.splice(i + 1, 0, { id: 'woke', label: 'Woke up', extra: 'signs' });
    });
    S.settings.wokeAdded = true;
  }
  migrateSleep(); migrateRoutine(); migrateStates(); migrateWeather(); migrateLoc(); migratePType(); migrateBreath(); migrateGaviscon(); migrateSurolan(); migrate33(); migrate34(); migrateGood(); migratePlans(); S.dayNotes = S.dayNotes || {}; S.settings = S.settings || {};
}
const noteKey = (dogId, date) => dogId + '|' + date;

/* Today: appointments + day note */
function focusHtml(d) {
  const f = S.focus.filter(x => x.dogId === d.id && !x.done);
  return `<div class="card" style="border:2px solid var(--dog)"><div class="row between"><h2>Current focus</h2><button class="btn sm" data-act="focusOpen" data-id="">Add</button></div>` +
    (f.length ? f.map(x => `<button class="mrow" data-act="focusOpen" data-id="${x.id}" style="border-top:${f[0] === x ? '0' : '1px dashed var(--line)'}"><span><span class="pre">${esc(x.text)}</span><br><span class="small muted">Since ${esc(fmtDate(x.start, true))}${x.notes ? '. ' + esc(x.notes.split('\n')[0]) : ''}</span></span><span class="muted">›</span></button>`).join('')
      : `<p class="empty" style="padding-bottom:0">Nothing set. Add what you're working on, e.g. settling her appetite.</p>`) + `</div>`;
}
function openFocus(id) {
  const x = id ? S.focus.find(f => f.id === id) : { text: '', start: UI.today, notes: '' };
  openSheet(`<h2>${id ? 'Edit focus' : 'Add a focus'}</h2>
    <label class="f">What we're focusing on</label><textarea class="i" id="fText" placeholder="e.g. Stabilise appetite">${esc(x.text)}</textarea>
    <label class="f">Started</label><input class="i" type="date" id="fStart" value="${esc(x.start)}">
    <label class="f">Thinking and progress notes</label><textarea class="i" id="fNotes" style="min-height:120px" placeholder="Current theory, what we're trying, what's changed">${esc(x.notes)}</textarea>
    ${id ? `<label class="f">When it's sorted: outcome</label><input class="i" id="fOutcome" placeholder="e.g. appetite steady for 2 weeks">` : ''}
    <div class="actions">${id ? `<button class="btn danger" data-act="focusDel" data-id="${id}">Delete</button><button class="btn" data-act="focusDone" data-id="${id}">Mark as done</button>` : ''}<button class="btn pri" data-act="focusSave" data-id="${id || ''}">Save</button></div>`);
}
function todayTopHtml(d, date) {
  const isToday = date === UI.today;

function dayPlanHtml(d, date) {

  let prev = '00:00';

    const m = S.meals.find(y => y.dogId === d.id && y.date === date && y.slot === sl.id);
    const t = (m && m.time) || sl.time;
    if (t) { if (sl.time) prev = sl.time; G(t, t, '').meals.push(sl); }
    else G(prev + '~' + sl.id, '', '').meals.push(sl);

  dogMeds(d.id).filter(m => !['monthly', 'quarterly', 'prn'].includes((m.schedule || {}).type) && isDueOn(m, date))
    .forEach(m => m.slots.forEach((sl, idx) => { const t = doseDisplayTime(m, sl, idx, date); G(t || '99:99', t, t ? '' : 'Any time').doses.push({ m, sl, idx }); }));

  if (!keys.length) h += `<p class="empty">Nothing scheduled. Add meal slots in Dogs, Edit, and doses in Meds.</p>`;
  h += keys.map(k => {
    const g = groups[k];

    const done = active.filter(x => { const e = doseEntry(x.m.id, date, x.idx); return e && (e.status === 'given' || e.status === 'late'); }).length;
    const problems = active.filter(x => { const e = doseEntry(x.m.id, date, x.idx); return e && (e.status === 'missed' || e.status === 'vomited'); }).length;
    const held = g.doses.length - active.length;
    const openKey = d.id + '|' + date + '|' + k;

    const shown = g.time || g.label;
    let s = `<div class="slot">${shown ? `<div class="slothead"><span class="t">${esc(shown)}</span></div>` : ''}`;
    s += g.meals.map(sl => mealRowHtml(d, sl, date)).join('');
    if (g.doses.length) {
      const allLogged = active.every(x => doseEntry(x.m.id, date, x.idx));
      const gtimes = [...new Set(active.map(x => doseEntry(x.m.id, date, x.idx)).filter(e => e && (e.status === 'given' || e.status === 'late')).map(e => e.time).filter(Boolean))].sort();
      const gtxt = gtimes.length ? 'given ' + (gtimes.length === 1 ? gtimes[0] : gtimes[0] + ' to ' + gtimes[gtimes.length - 1]) : '';
      s += `<div class="row between" style="margin-top:4px"><button class="linkbtn" data-act="planToggle" data-k="${esc(openKey)}" style="color:var(--ink);text-align:left">${isOpen ? '▾' : '▸'} Meds and supplements (${g.doses.length})</button>
        <span class="row" style="gap:6px">${gtxt ? `<span class="small muted">${esc(gtxt)}</span>` : ''}${problems ? `<span class="chip missed">${problems} problem${problems === 1 ? '' : 's'}</span>` : ''}${held ? `<span class="chip">${held} held</span>` : ''}${active.length ? `<span class="chip ${done === active.length ? 'given' : ''}">${done} of ${active.length}</span>` : ''}</span></div>`;
      s += `<div class="row wrap" style="gap:6px;margin:4px 0 2px">${!allLogged ? `<button class="btn sm pri" data-act="tickAll" data-t="${esc(g.time || 'Anytime')}">Mark all given</button>` : ''}<button class="btn sm" data-act="groupTime" data-t="${esc(g.time || 'Anytime')}">${allLogged ? 'Change time given' : 'Given at another time…'}</button></div>`;
      if (isOpen) s += g.doses.map(x => doseRowHtml(x.m, x.sl, x.idx, date)).join('');

  if (prn.length) h += `<div class="slot"><div class="slothead"><span class="t">As needed</span></div><p class="small muted" style="margin:-2px 0 4px">Not part of her routine. Tap Log whenever you give one.</p>` + prn.map(m => {
    const given = S.doses.filter(x => x.medId === m.id && x.date === date && x.status === 'prn').sort((a, b) => (a.time || '') < (b.time || '') ? -1 : 1);
    return `<div class="row between" style="padding:4px 0"><div><b>${esc(m.name)}</b><div class="small muted">${given.length ? 'Given ' + given.map(x => `<button class="chip" style="border:0;cursor:pointer" data-act="prnEdit" data-id="${x.id}" aria-label="Edit or delete this dose">${esc(x.time || '?')} ✎</button>`).join(' ') : 'Not given today'}</div></div><button class="btn sm" data-act="prn" data-id="${m.id}">Log</button></div>`;

}
function doseDisplayTime(m, sl, idx, date) {
  const e = doseEntry(m.id, date, idx);

function groupDoses(d, date, t) {

  return out;
}

const PLAN_ACTIONS = {
  gtPick: el => { const v = el.dataset.v; $$('.opts[data-group="gtdoses"] .opt').forEach(b => { const m = S.meds.find(x => x.id === b.dataset.v.split('|')[0]); b.classList.toggle('on', v === 'all' || (v === 'med' && m && m.cat === 'med') || (v === 'supp' && m && m.cat !== 'med')); }); },
  groupTime: el => openGroupTime(el.dataset.t),
  groupTimeSave: el => {
    const time = $('#gtTime').value; if (!time) return toast('Choose a time');
    const st = optVal('gtst') || 'given'; const pick = $$('.opts[data-group="gtdoses"] .opt.on').map(b => b.dataset.v);
    if (!pick.length) return toast('Tick at least one');
    let n = 0;
    groupDoses(dog(), UI.date, el.dataset.t).forEach(x => {
      if (!pick.includes(x.m.id + '|' + x.idx)) return;
      const e = doseEntry(x.m.id, UI.date, x.idx); if (e && (e.status === 'missed' || e.status === 'vomited')) return;
      setDose(x.m.id, UI.date, x.idx, st, time); n++;

    closeSheet(); render(); toast(n + ' dose' + (n === 1 ? '' : 's') + ' logged at ' + time);

    UI.stateUndo = null; save(); closeSheet(); render(); toast('Undone');

function routeChip(m, date) {
  if (typeof inFood !== 'function' || !S.plans) return '';
  const planned = S.plans.some(p => p.dogId === m.dogId && p.steps.some(st => st.kind === 'supp' && (st.medIds || []).includes(m.id)));
  if (!planned) return '';
  return inFood(m, date) ? ' <span class="chip given">in food</span>' : ' <span class="chip">by mouth</span>';
}

/* ---------- v1.8: settings screen, weather, day conditions ---------- */
const COND_OPTS = ['Hot day', 'Humid', 'Cold day', 'Storm or thunder', 'Fireworks', 'Busy house or visitors', 'Car trip', 'Other'];
function migrateWeather() { S.weather = S.weather || {}; S.dayTags = S.dayTags || {}; }
const backupDue = () => { const lb = S.lastBackup; return !lb || diffDays(lb.slice(0, 10), UI.today) >= 7; };
function weatherLine(date) {
  const w = S.weather[date]; if (!w) return '';
  const y = S.weather[addDays(date, -1)];
  const diff = y && w.max != null && y.max != null ? Math.round(w.max - y.max) : null;
  const hot = w.max >= 28;
  return `<div class="small" style="text-align:center;margin:-6px 0 12px;color:${hot ? 'var(--warn)' : 'var(--muted)'}">${hot ? '☀ ' : ''}Max ${Math.round(w.max)}°, min ${Math.round(w.min)}°${w.feels != null ? ', feels like up to ' + Math.round(w.feels) + '°' : ''}${diff ? ` (${diff > 0 ? '+' : ''}${diff}° on the day before)` : ''}</div>`;
}
async function fetchWeather(force) {
  const loc = S.settings.loc; if (!loc) return;
  if (!force && S.settings.wxAt && Date.now() - S.settings.wxAt < 3 * 3600000) return;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max&timezone=auto&past_days=92&forecast_days=1`;
    const r = await fetch(url); if (!r.ok) throw new Error(r.status);
    const j = await r.json(); const dd = j.daily;
    dd.time.forEach((t, i) => { if (dd.temperature_2m_max[i] != null) S.weather[t] = { max: dd.temperature_2m_max[i], min: dd.temperature_2m_min[i], feels: dd.apparent_temperature_max ? dd.apparent_temperature_max[i] : null }; });
    S.settings.wxAt = Date.now(); save();
    if (UI.tab === 'today' || UI.tab === 'log' || UI.tab === 'settings') render();
  } catch (e) { console.warn('weather', e); if (force) toast('Could not fetch the weather just now'); }
}

function planDayItems(dogId, date) {
  const out = [];
  (S.plans || []).filter(p => p.dogId === dogId).forEach(p => {
    if (p.stopped === date) out.push({ cls: 'bad', text: `✕ Stopped plan: ${p.name}${p.stopReason ? ' (' + p.stopReason + ')' : ''}` });
    (p.pauses || []).forEach(x => { if (x.from === date) out.push({ cls: 'warn', text: `⏸ Paused plan: ${p.name}${x.reason ? ' (' + x.reason + ')' : ''}` }); if (x.to === date) out.push({ cls: 'ok', text: `▶ Resumed plan: ${p.name}` }); });
    p.steps.forEach((s, i) => {
      const parts = [];
      if (s.start === date) parts.push('started');
      const ticks = (s.boxes || []).map((bx, k) => ({ bx, k })).filter(x => x.bx.date === date);
      if (ticks.length) parts.push(`${ticks.length} ${ticks.length === 1 ? 'meal' : 'meals'} ticked, now ${ticks[ticks.length - 1].k + 1} of ${stepTarget(s) || '?'}`);
      if (s.status === 'done' && s.doneDate === date) parts.push('✓ finished');
      const stopped = s.status === 'stopped' && s.stopDate === date;
      if (stopped && p.stopped !== date) parts.push('✕ stopped' + (s.outcome ? ' (' + s.outcome + ')' : ''));

function markerChart(m, pts) {

  if (y0 === y1) s += `<text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(fmtShort(num[num.length - 1].date))}</text>`;

/* ---------- backup ---------- */
async function doExport() {
  const stamp = new Date(); const name = `big-loves-backup-${dk(stamp)}.json`;
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const download = () => {
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };
  const done = msg => { S.lastBackup = stamp.toISOString(); save(); render(); toast(msg); };
  if (isIOS) {
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Big Loves backup' });
        return done('Backup exported');
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { download(); done('Backup saved to Downloads: ' + name); }
  catch (e) { toast('Export did not finish: ' + (e && e.message ? e.message : 'unknown error')); }
}
function doImport(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !data.dogs || !data.meds) throw new Error('bad');
      if (hasDogs() && !confirm('Replace everything in the app with this file?')) return;
      S = data; migrate(); UI.dog = S.dogs[0] ? S.dogs[0].id : ''; UI.tab = 'today'; save(); render(); toast('Loaded');
    } catch (e) { toast('That file is not a Big Loves backup or starter file'); }
  };
  r.readAsText(file);
}
function doPhoto(id, file) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 320; const c = document.createElement('canvas'); c.width = c.height = size;
      const s = Math.min(img.width, img.height); const ctx = c.getContext('2d');
      ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      S.dogs.find(x => x.id === id).photo = c.toDataURL('image/jpeg', .82); save(); render(); toast('Photo saved');
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

      if ((doseDisplayTime(m, sl, idx, UI.date) || 'Anytime') === t && !doseEntry(m.id, UI.date, idx) && !isHeld(m, UI.date, sl)) setDose(m.id, UI.date, idx, 'given', tickTime(sl));
    }));
    render(); toast(((S.settings || {}).tickTime === 'now' && UI.date === UI.today) ? 'Marked as given now' : 'Marked as given at ' + t);
  },
  tickP: el => { const m = S.meds.find(x => x.id === el.dataset.id); S.doses.push({ id: uid(), dogId: m.dogId, medId: m.id, date: UI.date, slot: 0, status: 'given', time: nowHM(), dose: '' }); save(); render(); toast(m.name + ' logged'); },
  doseOpts: el => openDoseOpts(el.dataset.id, +el.dataset.slot),

  },
  tickSetting: el => { S.settings = Object.assign({}, S.settings, { tickTime: el.dataset.v }); save(); render(); },
  foodAddList: () => { const lines = document.getElementById('foodNew').value.split('\n').map(x => x.trim()).filter(Boolean); let n = 0; lines.forEach(v => { if (!S.foods.includes(v)) { S.foods.push(v); n++; } }); if (!n) return toast('Nothing new to add'); save(); render(); toast(n + ' food' + (n === 1 ? '' : 's') + ' added'); },
  focusOpen: el => openFocus(el.dataset.id || null),

  },

  focusDel: el => { if (!confirm('Delete this focus?')) return; S.focus = S.focus.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); },
  apptOpen: el => openAppt(el.dataset.id || null),
  apptSave: el => {

  logMode: el => { UI.logMode = el.dataset.v; render(); },

  linkWin: el => { UI.linkWin = +el.dataset.v; render(); },
  foodRename: el => { const i = +el.dataset.i; const v = prompt('Rename food', S.foods[i]); if (v && v.trim()) { const old = S.foods[i]; S.foods[i] = v.trim(); S.meals.forEach(m => { m.foods = (m.foods || []).map(f => f === old ? v.trim() : f); }); save(); render(); } },
  foodDel: el => { const i = +el.dataset.i; if (!confirm('Remove "' + S.foods[i] + '" from the list? Meals already logged keep it.')) return; S.foods.splice(i, 1); save(); render(); },
  injLog: el => { const i = S.injections.find(x => x.id === el.dataset.id); openInjEdit(i.id); },
  injEdit: el => openInjEdit(el.dataset.id || null),
  injSave: el => {

    const dt = $('#iDate').value; if (dt && !i.doses.find(x => x.date === dt)) i.doses.push({ date: dt, note: $('#iDoseNote').value.trim() });
    save(); closeSheet(); render(); toast('Saved');
  },
  injDoseDel: el => { const i = S.injections.find(x => x.id === el.dataset.id); if (!confirm('Delete the dose on ' + fmtDate(el.dataset.date, true) + '?')) return; i.doses = i.doses.filter(x => x.date !== el.dataset.date); save(); openInjEdit(i.id); render(); },
  injDel: el => { if (!confirm('Delete this injection and its history?')) return; S.injections = S.injections.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); },
  mealOpen: el => openMeal(el.dataset.slot, el.dataset.id),
  foodAdd: () => {
    const v = $('#mNewFood').value.trim(); if (!v) return;

    const g = $('.opts[data-group="foods"]'); const b = document.createElement('button');

  },
  mealSave: el => {
    const foods = $$('.opts[data-group="foods"] .opt.on').map(b => b.dataset.v);
    const items = readMealItems();
    const eaten = optVal('eaten'); let outcome = optVal('outcome'); if (eaten) outcome = eaten === 'all' ? 'all' : eaten === 'none' ? 'refused' : 'partial';
    const data = { foods, items, outcome, eaten, sprinkles: optVal('sprinkles'), eat: optVal('eat'), dish: optVal('dish'), time: $('#mTime').value, note: $('#mNote').value.trim() };
    const ms = optVal('mslot'); if (ms) data.slot = ms === '_extra' ? '' : ms;
    if (data.slot) { const dup = S.meals.find(x => x.dogId === UI.dog && x.date === UI.date && x.slot === data.slot && x.id !== el.dataset.id); if (dup && !confirm('There is already a ' + (dog().mealSlots.find(s => s.id === data.slot) || {}).label + ' logged today. Save this as a second one?')) return; }
    if (el.dataset.id) Object.assign(S.meals.find(x => x.id === el.dataset.id), data);
    else S.meals.push(Object.assign({ id: uid(), dogId: UI.dog, date: UI.date, slot: el.dataset.slot || '' }, data));
    save(); closeSheet(); render(); toast('Meal saved');
  },
  symOpen: el => openSym(el.dataset.type),
  symSave: el => {
    const g = id => { const x = $(id); return x ? x.value.trim() : ''; };
    const data = { date: g('#sDate') || UI.date, time: g('#sTime'), severity: optVal('sev'), side: optVal('side'), kind: optVal('kind'), actions: $$('.opts[data-group="actions"] .opt.on').map(b => b.dataset.v), signs: $$('.opts[data-group="signs"] .opt.on').map(b => b.dataset.v), loc: optVal('sloc'), ptype: optVal('sptype'), btype: optVal('btype'), gwhen: $$('.opts[data-group="gwhen"] .opt.on').map(b => b.dataset.v), gprod: optVal('gprod'), gcount: optVal('gcount'), bwhile: optVal('bwhile'), rr: ($('#bRR') || {}).value || '', actionNote: g('#sAction'), resolved: g('#sResolved'), mealId: g('#sMeal'), note: g('#sNote'), custom: g('#sCustom') };
    let rec;
    if (el.dataset.id) { rec = S.symptoms.find(x => x.id === el.dataset.id); Object.assign(rec, data); }
    else { rec = Object.assign({ id: uid(), dogId: UI.dog, type: el.dataset.type }, data); S.symptoms.push(rec); }
    syncGave(rec, $$('.opts[data-group="gave"] .opt.on').map(b => b.dataset.v), rec.date, rec.time, symLabel(rec.dogId, rec.type).toLowerCase());
    save(); closeSheet(); render(); toast('Saved');
  },
  entryOpen: el => {
    const { kind, id } = el.dataset;
    if (kind === 'sym') { const s = S.symptoms.find(x => x.id === id); if (s.sleepId && S.sleeps.find(z => z.id === s.sleepId)) openSleep(s.sleepId, false); else openSym(s.type, id); }
    else if (kind === 'meal') { const m = S.meals.find(x => x.id === id); openMeal(m.slot, id); }
    else if (kind === 'dose') {
      const x = S.doses.find(y => y.id === id);
      if (x.status === 'extra') openExtraDose(x);
      else if (x.status === 'prn') openPrn(x.medId, x);
      else openSheet(`<h2>${esc(medName(x.medId))}</h2><p class="muted">${esc(fmtDate(x.date, true))}</p><label class="f">Time</label><input class="i" type="time" id="eTime" value="${esc(x.time)}"><div class="actions"><button class="btn danger" data-act="entryDel" data-kind="dose" data-id="${id}">Delete</button><button class="btn pri" data-act="doseTimeSave" data-id="${id}">Save</button></div>`);
    }
  },
  doseTimeSave: el => { const x = S.doses.find(y => y.id === el.dataset.id); x.time = $('#eTime').value || x.time; save(); closeSheet(); render(); toast('Saved'); },
  entryDel: el => {
    if (!confirm('Delete this entry?')) return;
    const { kind, id } = el.dataset;
    if (kind === 'sym') S.symptoms = S.symptoms.filter(x => x.id !== id);
    if (kind === 'meal') { S.meals = S.meals.filter(x => x.id !== id); S.symptoms.forEach(s => { if (s.mealId === id) s.mealId = ''; }); }
    if (kind === 'dose') S.doses = S.doses.filter(x => x.id !== id);
    save(); closeSheet(); render(); toast('Deleted');
  },
  logMore: () => { UI.logDays += 60; render(); },
  medEdit: el => { openMedEdit(el.dataset.id || null); schedFields(); },
  slotAdd: () => { $('#eSlots').insertAdjacentHTML('beforeend', slotRowsHtml([{ t: '', dose: '', label: '' }])); },
  slotDel: el => { el.closest('.slotrow').remove(); },
  medSave: el => {
    const name = $('#eName').value.trim(); if (!name) return toast('Add a name first');
    const type = optVal('sched') || 'daily';
    const schedule = { type };
    if (type === 'alternate') schedule.anchor = $('#eAnchor').value || UI.today;
    if (type === 'monthly' || type === 'quarterly') schedule.day = Math.min(28, Math.max(1, +$('#eDay').value || 1));
    if (type === 'weekly') { schedule.days = $$('.opts[data-group="wdays"] .opt.on').map(b => +b.dataset.v); if (!schedule.days.length) return toast('Pick at least one day'); }
    if (type === 'quarterly') schedule.months = $$('.opts[data-group="months"] .opt.on').map(b => +b.dataset.v).sort((a, b) => a - b);
    const slots = $$('#eSlots .slotrow').map(r => ({ t: r.querySelector('[data-f="t"]').value, dose: r.querySelector('[data-f="dose"]').value.trim(), label: r.querySelector('[data-f="label"]').value.trim() })).filter(s => s.t || s.dose || s.label);
    if (type !== 'prn' && !slots.length) slots.push({ t: '', dose: '', label: '' });
    const keepSlots = (type === 'monthly' || type === 'quarterly') ? [{ t: '', dose: slots[0] ? slots[0].dose : '', label: '' }] : slots;
    const data = { name, cat: optVal('cat') || 'med', schedule, slots: type === 'prn' ? [] : keepSlots, note: $('#eNote').value.trim(), paused: optVal('paused') === 'yes' };
    if (el.dataset.id) {
      const m = S.meds.find(x => x.id === el.dataset.id); const before = describeMed(m);
      Object.assign(m, data); const after = describeMed(m);
      if (before !== after) m.history.push({ date: UI.today, time: nowHM(), text: 'Changed to: ' + after + (($('#eReason') || {}).value ? '\nReason: ' + $('#eReason').value.trim() : '') });
    } else {
      const m = Object.assign({ id: uid(), dogId: UI.dog, dose: '', history: [] }, data); m.history.push({ date: UI.today, time: nowHM(), text: 'Added: ' + describeMed(m) }); S.meds.push(m);
    }
    save(); closeSheet(); render(); toast('Saved');
  },
  medDel: el => { if (!confirm('Delete this medication? Its dose log stays in the Log.')) return; S.meds = S.meds.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); },
  marker: el => openMarker(el.dataset.k),
  bloodRange: el => { UI.bloodRange = el.dataset.v; openMarker(el.dataset.k); },
  bloodAdd: () => openBloodAdd(null),
  bloodEdit: el => openBloodAdd(el.dataset.date),
  bloodSave: el => {
    const date = el.dataset.date || $('#bDate').value; if (!date) return toast('Choose the test date');
    const vals = {};
    $$('input[data-k]').forEach(inp => { const v = inp.value.trim(); if (!v) return; const n = Number(v.replace(',', '.')); vals[inp.dataset.k] = isNaN(n) ? { t: v } : { v: n }; });
    if (!Object.keys(vals).length) return toast('No values entered');
    const list = S.bloods[UI.dog] = S.bloods[UI.dog] || [];
    let r = list.find(x => x.date === date);
    if (!r) { r = { date, precision: 'day', values: {} }; list.push(r); }
    if (el.dataset.date) { Object.keys(r.values).forEach(k => { if (!vals[k] && !(r.values[k].low != null)) delete r.values[k]; }); }
    Object.keys(vals).forEach(k => { r.values[k] = Object.assign({}, r.values[k] && r.values[k].low != null ? { low: r.values[k].low, high: r.values[k].high } : {}, vals[k]); });
    save(); closeSheet(); render(); toast('Results saved');
  },
  bloodDates: () => openBloodDates(),
  bloodDate: el => openBloodDate(el.dataset.date),
  bloodDel: el => { if (!confirm('Delete all results for ' + fmtDate(el.dataset.date, true) + '?')) return; S.bloods[UI.dog] = S.bloods[UI.dog].filter(x => x.date !== el.dataset.date); save(); closeSheet(); render(); },
  photo: el => { pendingPhoto = el.dataset.id; const i = document.getElementById('photoIn'); i.value = ''; i.click(); },
  dogEdit: el => openDogEdit(el.dataset.id),
  dogSave: el => {
    const d = S.dogs.find(x => x.id === el.dataset.id);
    const v = id => { const x = $(id); return x ? x.value.trim() : ''; };
    Object.assign(d, { name: v('#gName') || d.name, breed: v('#gBreed'), sex: v('#gSex'), dob: v('#gDob'), conditions: v('#gCond'), history: v('#gHist'), avoid: v('#gAvoid'), cautions: v('#gCaut') });
    if (optVal('track')) d.trackSleep = optVal('track') === 'yes';
    if ($('#gDue')) { d.due = v('#gDue'); d.status = optVal('status') || d.status; }
    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    d.symptoms = v('#gSym').split('\n').map(x => x.trim()).filter(Boolean).map(l => { const old = d.symptoms.find(s => s.label === l); return old || { id: slug(l), label: l }; });
    if (!d.symptoms.find(s => s.id === 'other')) d.symptoms.push({ id: 'other', label: 'Other' });
    d.mealSlots = v('#gMeals').split('\n').map(x => x.trim()).filter(Boolean).map(line => {
      const parts = line.split(',').map(x => x.trim()); const label = parts[0];
      const time = parts.find(p => /^\d{1,2}:\d{2}$/.test(p)) || ''; const optional = parts.some(p => p.toLowerCase() === 'optional');
      const old = d.mealSlots.find(s => s.label === label);
      return { id: old ? old.id : slug(label), label, time: time.length === 4 ? '0' + time : time, optional };
    });
    save(); closeSheet(); render(); toast('Saved');
  },
  export: () => doExport(),
  import: () => { const i = document.getElementById('importIn'); i.value = ''; i.click(); }
};

Object.assign(A, SLEEP_ACTIONS, ROUTINE_ACTIONS, STATE_ACTIONS, PLAN_ACTIONS, WX_ACTIONS, PAT_ACTIONS, LOC_ACTIONS, PTYPE_ACTIONS, REPORT_ACTIONS, BREATH_ACTIONS, PLAN3_ACTIONS, STOOL_ACTIONS, GOOD_ACTIONS, PRN_EDIT, CARD_ACTIONS, PLAN2_ACTIONS, REHAB_ACTIONS);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.dosetime) { return; }
  if (e.target.id === 'dayNote') { const k = noteKey(e.target.dataset.dog, e.target.dataset.date); const v = e.target.value.trim(); if (v) S.dayNotes[k] = v; else delete S.dayNotes[k]; save(); toast('Note saved'); }
  if (e.target.id === 'photoIn' && e.target.files[0] && pendingPhoto) doPhoto(pendingPhoto, e.target.files[0]);
  if (e.target.id === 'importIn' && e.target.files[0]) doImport(e.target.files[0]);
});
document.addEventListener('toggle', e => { const t = e.target; if (t && t.classList && t.classList.contains('fold') && t.dataset.k) UI.open[t.dataset.k] = t.open; }, true);
document.addEventListener('focusout', e => {
  const t = e.target; if (!t.dataset || !t.dataset.dosetime) return;
  const x = doseEntry(t.dataset.id, UI.date, +t.dataset.slot);
  if (x && t.value && t.value !== x.time) { x.time = t.value; save(); setTimeout(() => { render(); toast('Time saved: ' + x.time); }, 50); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- day rollover after the phone sleeps ---------- */
function checkRollover() {
  const t = dk(); if (t !== UI.today) { const wasToday = UI.date === UI.today; UI.today = t; if (wasToday) UI.date = t; render(); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkRollover(); fetchWeather(); } });
window.addEventListener('focus', checkRollover);
setInterval(checkRollover, 60000);

/* ---------- start ---------- */
load(); render(); fetchWeather();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }

</script>
